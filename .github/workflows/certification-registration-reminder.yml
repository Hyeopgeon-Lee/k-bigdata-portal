name: Certification registration reminders
on:
  # 09:00 / 11:00 Korea time. Backup run is idempotent.
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certification-registration-reminder.yml"
      - "supabase/functions/certification-registration-reminder/**"
      - "tests/certification-registration-reminder.test.mjs"
      - "tests/certification-calendar-integration.test.mjs"
      - "js/certification-schedule.mjs"
      - "js/schedule.js"
      - "schedule.html"
permissions:
  contents: read
  id-token: write
jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate eligibility rules and integrated calendar
        run: |
          node --check js/schedule.js
          node --check js/certification-schedule.mjs
          node --test tests/certification-registration-reminder.test.mjs tests/certification-calendar-integration.test.mjs
      - name: Invoke Supabase sender with GitHub OIDC
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FUNCTION_URL: https://zjsindkakjfzmjgrkaou.supabase.co/functions/v1/certification-registration-reminder
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --max-time 12 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kbigdata-certification-registration-reminder")
          id_token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            payload='{"dry_run":false}'
          else
            payload='{"dry_run":true}'
          fi
          curl --fail-with-body --silent --show-error --retry 1 --max-time 240 \
            -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            --data "$payload"
          echo
