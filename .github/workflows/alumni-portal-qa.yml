name: Alumni Network Portal Integration QA
on:
  push:
    paths:
      - "alumni/**"
      - "supabase/functions/alumni-network-api/**"
      - "supabase/migrations/*migrate_alumni_network*"
      - "js/services.js"
      - "scripts/build-portal-shell.mjs"
      - "tests/alumni-portal.test.mjs"
      - ".github/workflows/alumni-portal-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/alumni-portal.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify visual editor, responsive layout and safe submission
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/alumni-contact-server.log 2>&1 &
          node tests/alumni-contact-editor.browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alumni-contact-editor-screenshots
          path: ui-screenshots/alumni-contact/
          if-no-files-found: ignore
