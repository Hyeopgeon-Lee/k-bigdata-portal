name: 350 lesson UI and sharing QA
on:
  push:
    paths:
      - "coding.html"
      - "css/coding.css"
      - "data/coding-*.js"
      - "js/coding.js"
      - "js/coding-editor.js"
      - "js/coding-completion-data.js"
      - "js/learning-report.js"
      - "js/services.js"
      - "tests/coding-page.test.mjs"
      - "tests/coding-c-help-regression.test.mjs"
      - "tests/coding-20261022-help.test.mjs"
      - "scripts/qa-coding-c.mjs"
      - "tests/coding-page-browser.mjs"
      - ".github/workflows/coding-page-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate question registry, links, share and report UI
        run: node tests/coding-page.test.mjs
      - name: Verify C issue regression and per-question guidance
        run: node tests/coding-c-help-regression.test.mjs
      - name: Verify Oct 22 Help report regression coverage
        run: node tests/coding-20261022-help.test.mjs
      - name: Compile and execute all C learning solutions and boundary cases
        run: node scripts/qa-coding-c.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify sharing, report links and five responsive viewports
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portal-coding-server.log 2>&1 &
          node tests/coding-page-browser.mjs
      - name: Upload learning page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-page-viewport-screenshots
          path: ui-screenshots/learning-*.png
          if-no-files-found: ignore
