name: Ubuntu 50 command lesson QA
on:
  push:
    paths:
      - "data/coding-ubuntu-*.js"
      - "data/coding-samples.js"
      - "js/coding.js"
      - "coding.html"
      - "css/coding.css"
      - "scripts/qa-ubuntu.mjs"
      - ".github/workflows/ubuntu-coding-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-lesson-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate 50 lessons, bash syntax and safe command smoke tests
        run: node scripts/qa-ubuntu.mjs
