name: Import approved verified alumni into portal
# Safe rerun: only pending rows are processed; already imported identities are untouched.
# 2026-11-13: import three explicitly approved 2027 early-employed candidates.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alumni-import.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify GitHub OIDC and securely import approved alumni
        shell: bash
        env:
          FUNCTION_URL: https://zjsindkakjfzmjgrkaou.supabase.co/functions/v1/import-approved-alumni
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kbigdata-approved-alumni-import")
          id_token=$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          curl --fail-with-body --silent --show-error --max-time 180 \
            -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":false}'
          echo
