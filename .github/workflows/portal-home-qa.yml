name: Portal home UI QA
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/home-ui.css"
      - "css/home-alerts.css"
      - "css/home-grade.css"
      - "js/app.js"
      - "js/home-dashboard.js"
      - "js/home-schedule.js"
      - "data/calendar-grade-bridge.js"
      - "tests/calendar-grade-bridge.test.mjs"
      - "js/home-recruit-alerts.js"
      - "js/schedule.js"
      - "schedule.html"
      - "js/portal-personal.js"
      - "js/search-ui.js"
      - "js/portal-shell.js"
      - "js/portal-shell-entry.js"
      - "tests/portal-dashboard.test.mjs"
      - "tests/portal-home-browser.mjs"
      - ".github/workflows/portal-home-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate home UX contracts and local preference behavior
        run: node tests/portal-dashboard.test.mjs
      - name: Validate calendar memo grade fallback
        run: node tests/calendar-grade-bridge.test.mjs
      - name: Check home JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/home-dashboard.js
          node --check js/home-schedule.js
          node --check data/calendar-grade-bridge.js
          node --check js/home-recruit-alerts.js
          node --check js/search-ui.js
          node --check js/portal-shell.js
          node --check js/portal-personal.js
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check 5 viewports, favorites, search and tab interactions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portal-home-server.log 2>&1 &
          node tests/portal-home-browser.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-home-viewport-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
