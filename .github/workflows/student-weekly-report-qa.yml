name: Student weekly report dashboard QA
on:
  push:
    branches: [main]
    paths: ['weekly-report.html','mypage.html','js/weekly-report.js','js/my-page.js','js/portal-auth.mjs','js/portal-navigation.js','css/weekly-report.css','css/my-page.css','supabase/functions/student-weekly-report/**','supabase/functions/ready-api/rules.mjs','supabase/migrations/*student_weekly_reports.sql','tests/student-weekly-report*','tests/interview-practice-record-browser.mjs','tests/interview-session.test.mjs','js/interview-ui.js','js/interview-session.js','js/learning-ui.js','interview.html','supabase/migrations/*interview_practice_events.sql','.github/workflows/student-weekly-report-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/student-weekly-report.test.mjs
          node tests/portal-shell.test.mjs
          node tests/interview-session.test.mjs
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/weekly-http.log 2>&1 &
          node tests/student-weekly-report-browser.mjs
          node tests/interview-practice-record-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-weekly-dashboard-screenshots
          path: ui-screenshots/weekly/
          if-no-files-found: ignore
