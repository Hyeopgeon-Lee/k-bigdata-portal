name: Study absence reminders
on:
  # Tuesday-Saturday 00:00 UTC = 09:00 Korea, checks previous school day.
  schedule:
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/study-absence-reminder.yml"
permissions:
  contents: read
  id-token: write
jobs:
  check-study-absence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Use GitHub OIDC to invoke Supabase without reusable secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          FUNCTION_URL: https://zjsindkakjfzmjgrkaou.supabase.co/functions/v1/study-absence-reminder
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --max-time 12 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kbigdata-study-absence-reminder")
          id_token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          payload='{"dry_run":false}'
          if [[ "$EVENT_NAME" == "push" ]]; then payload='{"dry_run":true}'; fi
          curl --fail-with-body --silent --show-error --retry 2 --max-time 90 \
            -X POST "$FUNCTION_URL" -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" --data "$payload"
          echo
