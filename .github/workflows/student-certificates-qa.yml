name: Student Certificates QA
on:
  push:
    paths:
      - "my-certifications.html"
      - "mypage.html"
      - "js/my-certifications.js"
      - "js/portal-auth.mjs"
      - "js/portal-navigation-model.mjs"
      - "css/my-certifications.css"
      - "supabase/migrations/*student_certifications*"
      - "tests/portal-student-certifications.test.mjs"
      - ".github/workflows/student-certificates-qa.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/portal-student-certifications.test.mjs
