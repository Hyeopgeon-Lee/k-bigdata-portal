name: Practical runtime audit

on:
  push:
    branches: [main]
    paths:
      - "data/practical/**"
      - "tests/practical-runtime-audit.py"
      - "tests/practical-30pass-audit.mjs"
      - "tests/practical-beginner-review.test.mjs"
      - "tests/practical-dataset-deep-audit.mjs"
      - "tests/practical-parallel-expert-audit.mjs"
      - "tests/practical-code-formatting.test.mjs"
      - "js/practical-core.js"
      - "js/practical-explanation.js"
      - "js/practical-ui.js"
      - "css/practical.css"
      - ".github/workflows/practical-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run 30-pass content QA
        run: node tests/practical-30pass-audit.mjs
      - name: Run beginner expert review
        run: node tests/practical-beginner-review.test.mjs
      - name: Run 360-round dataset deep audit
        run: node tests/practical-dataset-deep-audit.mjs
      - name: Run parallel expert audit workers
        run: node tests/practical-parallel-expert-audit.mjs
      - name: Verify C/Java display indentation
        run: node tests/practical-code-formatting.test.mjs
      - name: Verify all executable answers
        run: python tests/practical-runtime-audit.py
