name: Practical runtime audit

on:
  push:
    branches: [main]
    paths:
      - "data/practical/**"
      - "tests/practical-runtime-audit.py"
      - "tests/practical-sql-runtime.py"
      - "tests/practical-30pass-audit.mjs"
      - "tests/practical-beginner-review.test.mjs"
      - "tests/practical-dataset-deep-audit.mjs"
      - "tests/practical-parallel-expert-audit.mjs"
      - "tests/practical-code-formatting.test.mjs"
      - "tests/practical-industrial-source-fidelity.test.mjs"
      - "tests/practical-engineer-source-fidelity.test.mjs"
      - "tests/practical*.mjs"
      - "tests/fixtures/practical-continuation-baseline.json"
      - "js/practical-core.js"
      - "js/practical-explanation.js"
      - "js/practical-ui.js"
      - "css/practical.css"
      - ".github/workflows/practical-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run complete practical regression suite
        run: node tests/practical-suite.mjs
      - name: Verify all executable answers
        run: python tests/practical-runtime-audit.py
      - name: Verify every SQL result and count scenario
        run: python tests/practical-sql-runtime.py
