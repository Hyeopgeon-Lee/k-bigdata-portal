name: READY portal UI and role QA
on:
  push:
    branches: [main]
    paths: ['ready.html', 'admin/ready.html', 'js/ready*.js', 'js/ready*.mjs', 'css/ready.css', 'supabase/functions/ready-api/**', 'tests/ready-*', 'tests/fixtures/approved-student.mjs', '.github/workflows/ready-ui-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ready-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify READY role checks, Notion flow and shared page shell
        run: |
          node tests/ready-ui.test.mjs
          node tests/ready-integration.test.mjs
          node tests/ready-notion-oauth.test.mjs
          node tests/portal-shell.test.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify account-specific UI and mobile widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ready-ui-http.log 2>&1 &
          node tests/ready-ui-browser.mjs
      - name: Upload isolated READY UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-ui-screenshots
          path: ui-screenshots/ready/
          if-no-files-found: ignore
