name: One-time student weekly mail test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/student-weekly-one-time-test.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: student-weekly-one-time-test
  cancel-in-progress: false
jobs:
  send-one-confirmed-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Send only the server-resolved verified test account
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 2 --max-time 12 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kbigdata-weekly-learning-report-one-time-test")
          token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          result=$(curl --fail-with-body --silent --show-error --retry 1 --max-time 35 \
            -X POST 'https://zjsindkakjfzmjgrkaou.supabase.co/functions/v1/weekly-learning-report' \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"one_time_student_test"}')
          printf '%s' "$result" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x["ok"] and x["test"] and x["accepted"]==1; print(json.dumps(x,ensure_ascii=False))'
