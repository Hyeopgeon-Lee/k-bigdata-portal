name: Regenerate cleaned portal page shells (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portal-copy-regenerate-once.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate portal pages from single source of truth
        run: |
          node scripts/build-portal-shell.mjs
          node scripts/build-portal-shell.mjs --check
          node tests/portal-shell.test.mjs
          node tests/portal-copy-cleanup.test.mjs
          node tests/alumni-portal.test.mjs
          node tests/portal-auth.test.mjs
      - name: Commit regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate portal shells after content cleanup"
            git push origin HEAD:main
          fi
