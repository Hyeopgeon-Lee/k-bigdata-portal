name: Portal My Page QA
on:
  push:
    paths:
      - "mypage.html"
      - "js/my-page.js"
      - "css/my-page.css"
      - "js/portal-auth.mjs"
      - "js/portal-navigation-model.mjs"
      - "tests/portal-my-page.test.mjs"
      - "tests/portal-auth.test.mjs"
      - ".github/workflows/portal-my-page-qa.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/portal-my-page.test.mjs
      - run: node tests/portal-auth.test.mjs
