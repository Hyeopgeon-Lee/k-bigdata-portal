<section class="alumni-admin" aria-label="졸업생 네트워크 관리 업무">
  <div id="admin-status" class="status" hidden></div>
  <div id="admin-app" hidden><div class="alumni-admin-toolbar"><span>졸업생 · 채용공고 · 동문소식</span><button type="button" id="admin-logout" class="button--secondary">학생 포털 홈</button></div>
    <div class="tabs admin-tabs"><button data-view="alumni" aria-selected="true">졸업생 현황</button><button data-view="jobs" aria-selected="false">채용정보 관리</button><button data-view="news" aria-selected="false">동문소식 관리</button><button data-view="requests" aria-selected="false">연락 요청</button><button data-view="mail_logs" aria-selected="false">메일 발송 기록</button></div>
    <div class="admin-create-actions" aria-label="관리자 직접 등록"><button id="show-admin-job-form" type="button">채용공고 직접 등록</button><button id="show-admin-news-form" class="button--secondary" type="button">동문소식 직접 등록</button></div>
    <section id="admin-job-create" class="panel admin-create-panel" hidden>
      <div class="admin-create-heading"><div><h2>채용공고 직접 등록</h2></div><button type="button" class="button--ghost" data-close-create>닫기</button></div>
      <form id="admin-job-form"><div class="form-grid">
        <div class="field field--full"><label for="admin-job-alumni">등록 졸업생 *</label><select id="admin-job-alumni" name="alumni_id" data-admin-alumni required><option value="">졸업생 선택</option></select></div>
        <div class="field"><label for="admin-job-company">회사명 *</label><input id="admin-job-company" name="company" maxlength="100" required></div><div class="field"><label for="admin-job-title">채용 직무 *</label><input id="admin-job-title" name="job_title" maxlength="100" required></div>
        <div class="field"><label for="admin-job-recruit">채용 구분 *</label><select id="admin-job-recruit" name="recruit_type" required><option>신입</option><option>경력</option><option>신입·경력</option></select></div><div class="field"><label for="admin-job-employment">고용 형태 *</label><select id="admin-job-employment" name="employment_type" required><option>정규직</option><option>계약직</option><option>인턴</option><option>기타</option></select></div>
        <div class="field"><label for="admin-job-location">근무지역</label><input id="admin-job-location" name="location" maxlength="100"></div><div class="field"><label for="admin-job-deadline">마감일</label><input id="admin-job-deadline" name="deadline" type="date"></div>
        <div class="field field--full"><label for="admin-job-url">공식 채용공고 URL *</label><input id="admin-job-url" name="job_url" type="url" inputmode="url" placeholder="https://" required></div><div class="field field--full"><label for="admin-job-skills">주요 기술</label><input id="admin-job-skills" name="skills" maxlength="300" placeholder="Java, Spring Boot, SQL"></div>
        <div class="field field--full"><label for="admin-job-comment">선배의 한마디</label><textarea id="admin-job-comment" name="alumni_comment" maxlength="800" rows="4"></textarea></div>
      </div><div class="admin-check-grid"><label class="check"><input name="always_open" type="checkbox"> 상시채용</label><label class="check"><input name="referral_available" type="checkbox"> 사내추천 가능</label><label class="check"><input name="contact_allowed" type="checkbox"> 공고 문의 가능</label><label class="check"><input name="queue_mail" type="checkbox" checked> 다음 채용메일에 포함</label></div><div class="actions"><button type="submit">채용공고 게시</button><button type="button" class="button--ghost" data-close-create>취소</button></div></form>
    </section>
    <section id="admin-news-create" class="panel admin-create-panel" hidden>
      <div class="admin-create-heading"><div><h2>동문소식 직접 등록</h2></div><button type="button" class="button--ghost" data-close-create>닫기</button></div>
      <form id="admin-news-form"><div class="form-grid">
        <div class="field field--full"><label for="admin-news-alumni">소식 대상 졸업생 *</label><select id="admin-news-alumni" name="target_alumni_id" data-admin-alumni required><option value="">졸업생 선택</option></select></div>
        <div class="field"><label for="admin-news-type">소식 종류 *</label><select id="admin-news-type" name="news_type" required><option value="EMPLOYMENT">취업</option><option value="JOB_CHANGE">이직</option><option value="PROMOTION">승진·보직</option><option value="STARTUP">창업</option><option value="GRADUATE_SCHOOL">대학원·학위</option><option value="ACHIEVEMENT">수상·성과</option><option value="MARRIAGE">결혼</option><option value="BIRTH_SON">득남</option><option value="BIRTH_DAUGHTER">득녀</option><option value="OBITUARY">부고</option><option value="OTHER">기타</option></select></div><div class="field"><label for="admin-news-date">관련 날짜</label><input id="admin-news-date" name="event_date" type="date"></div>
        <div class="field field--full"><label for="admin-news-title">제목 *</label><input id="admin-news-title" name="title" maxlength="120" required></div>
        <div class="field"><label for="admin-news-company">회사·서비스명</label><input id="admin-news-company" name="company" maxlength="100"></div><div class="field"><label for="admin-news-job">직무</label><input id="admin-news-job" name="job_title" maxlength="100"></div><div class="field"><label for="admin-news-organization">관련 기관</label><input id="admin-news-organization" name="organization" maxlength="100"></div><div class="field"><label for="admin-news-position">직책·성과명</label><input id="admin-news-position" name="position_title" maxlength="100"></div><div class="field"><label for="admin-news-school">대학원명</label><input id="admin-news-school" name="school_name" maxlength="100"></div><div class="field"><label for="admin-news-degree">학위·과정</label><input id="admin-news-degree" name="degree_or_program" maxlength="100"></div>
        <div class="field"><label for="admin-news-location">장소·빈소</label><input id="admin-news-location" name="location" maxlength="200"></div><div class="field" id="admin-news-relationship-field" hidden><label for="admin-news-relationship">고인과의 관계 *</label><select id="admin-news-relationship" name="relationship"><option value="">선택</option><option>본인</option><option>부친</option><option>모친</option><option>배우자</option><option>자녀</option><option>조부</option><option>조모</option><option>장인</option><option>장모</option><option>기타</option></select></div>
        <div class="field field--full"><label for="admin-news-url">외부 안내 URL</label><input id="admin-news-url" name="external_url" type="url" inputmode="url" placeholder="https://"></div><div class="field field--full"><label for="admin-news-content">내용 *</label><textarea id="admin-news-content" name="content" maxlength="2000" rows="7" required></textarea></div>
      </div><label class="check"><input name="send_mail" type="checkbox"> 게시 후 동문소식 수신 동의자에게 이메일 발송</label><div class="actions"><button type="submit">동문소식 게시</button><button type="button" class="button--ghost" data-close-create>취소</button></div></form>
    </section>
    <div class="panel"><div class="filter-grid"><div class="field"><label for="admin-query">검색</label><input id="admin-query" placeholder="이름, 회사, 직무, 제목"></div><div class="field"><label for="admin-status-filter">상태</label><select id="admin-status-filter"><option value="">전체</option><option>APPROVED</option><option>HIDDEN</option><option>EXPIRED</option><option>SENT</option><option>PARTIAL_FAILED</option><option>FAILED</option><option>QUOTA_BLOCKED</option></select></div><div class="field"><label for="admin-year">졸업연도</label><select id="admin-year"></select></div><div class="field"><label>&nbsp;</label><button id="admin-refresh">새로고침</button></div></div><div class="actions admin-utilities"><button id="send-consent-invites" class="button--secondary" type="button">채용메일 수신 설정 안내</button><button id="send-news-consent-invites" class="button--secondary" type="button">동문소식 수신 설정 안내</button><button id="run-job-digest" class="button--secondary" type="button">채용메일 지금 점검·발송</button></div></div>
    <div id="admin-table" class="table-wrap"></div>
  </div>
</section>
